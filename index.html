<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Routine — a personal operating system for work, training, health, learning and money." />
    <title>Routine</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Paint the right theme before first paint so there is no flash.
      (() => {
        try {
          const saved = localStorage.getItem('routine.theme');
          const theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
        } catch { /* default stays dark */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
